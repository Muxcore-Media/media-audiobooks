syntax = "proto3";

package muxcore.audiobooks.v1;

option go_package = "github.com/Muxcore-Media/media-audiobooks/proto/gen/muxcore/audiobooks/v1;audiobooksv1";

// AudiobookManagementService is an audiobook library manager (scaffold).
service AudiobookManagementService {
  rpc AddAuthor(AddAuthorRequest) returns (AddAuthorResponse);
  rpc GetAuthor(GetAuthorRequest) returns (GetAuthorResponse);
  rpc ListAuthors(ListAuthorsRequest) returns (ListAuthorsResponse);
  rpc RemoveAuthor(RemoveAuthorRequest) returns (RemoveAuthorResponse);
  rpc AddAudiobook(AddAudiobookRequest) returns (AddAudiobookResponse);
  rpc ListAudiobooks(ListAudiobooksRequest) returns (ListAudiobooksResponse);
}

message Author {
  string id = 1;
  string name = 2;
  bool monitored = 3;
  string path = 4;
}

message Audiobook {
  string id = 1;
  string author_id = 2;
  string title = 3;
  string narrator = 4;
  string asin = 5;
  int32 year = 6;
  int32 duration_seconds = 7;
  bool monitored = 8;
}

message AddAuthorRequest {
  string name = 1;
  bool monitored = 2;
  string path = 3;
}
message AddAuthorResponse { Author author = 1; }
message GetAuthorRequest { string id = 1; }
message GetAuthorResponse { Author author = 1; }
message ListAuthorsRequest { string query = 1; }
message ListAuthorsResponse { repeated Author authors = 1; }
message RemoveAuthorRequest { string id = 1; bool delete_files = 2; }
message RemoveAuthorResponse { bool success = 1; }

message AddAudiobookRequest {
  string author_id = 1;
  string title = 2;
  string narrator = 3;
  string asin = 4;
  int32 year = 5;
  int32 duration_seconds = 6;
  bool monitored = 7;
}
message AddAudiobookResponse { Audiobook audiobook = 1; }
message ListAudiobooksRequest { string author_id = 1; }
message ListAudiobooksResponse { repeated Audiobook audiobooks = 1; }
